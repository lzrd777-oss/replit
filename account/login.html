<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход – HHC-STORE</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/account/auth.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <a class="brand" href="/">
        <img src="/hhc-store-logo.svg" alt="" />
        <span>HHC-STORE</span>
      </a>
      <h1>Вход</h1>
      <p class="sub">Влезте в профила си</p>
      <p id="auth-error" class="error hidden"></p>
      <form id="login-form">
        <label>Имейл<input id="email" type="email" required autocomplete="email" /></label>
        <label>Парола<input id="password" type="password" required autocomplete="current-password" /></label>
        <button type="submit">Вход</button>
      </form>
      <p class="switch">Нямате акаунт? <a href="/bg/registrace">Регистрация</a></p>
    </div>
  </div>
  <script src="/account/auth.js" defer></script>
</body>
</html>
