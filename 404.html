<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Страницата не е намерена | HHC-STORE</title>
  <link rel="icon" href="/icon.svg" />
  <style>
    :root {
      --bg: #050705;
      --green: #39e26a;
      --text: #f3f6f4;
      --muted: #8b968f;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 480px at 70% -20%, rgba(57, 226, 106, 0.16), transparent 50%),
        radial-gradient(800px 400px at 10% 110%, rgba(57, 226, 106, 0.08), transparent 45%),
        var(--bg);
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      margin-bottom: 28px;
    }
    .brand img {
      height: 30px;
      filter: brightness(0) invert(1);
    }
    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 0.9;
      background: linear-gradient(180deg, #fff 20%, rgba(57, 226, 106, 0.85));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }
    p {
      margin: 0 auto 28px;
      max-width: 420px;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }
    .btn-primary {
      background: var(--green);
      color: #04110a;
    }
    .btn-ghost {
      border: 1px solid #2a3530;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <a class="brand" href="/">
        <img src="/hhc-store-logo.svg" alt="" />
        <span>HHC-STORE</span>
      </a>
      <p class="code">404</p>
      <h1>Страницата не е намерена</h1>
      <p>Линкът е грешен или страницата е премахната. Върнете се към магазина и продължете пазаруването.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Към началото</a>
        <a class="btn btn-ghost" href="/bg/produkty">Всички продукти</a>
      </div>
    </div>
  </div>
</body>
</html>
