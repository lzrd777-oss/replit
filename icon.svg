<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="HHC-STORE">
  <!-- Favicon storefrontu. Písmeno je vyříznuté z firemního nápisu
       (public/hhc-store_-_logo_.svg), ne překreslené — drží tak segmentovaný
       dřík, podle kterého je značka poznat. Nápis samotný je moc široký, na
       16 px by z něj zbyla čára.

       Černý podklad odpovídá hlavičce e-shopu a drží kontrast na světlém
       i tmavém pruhu záložek; administrace má tentýž znak obráceně, aby šly
       obě aplikace v záložkách rozeznat. -->
