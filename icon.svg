    transform="translate(25.48 80) scale(0.6506)"
    fill="#ffffff"
    d="M 24.765625 0 L 3.6875 0 L 3.6875 -33.734375 L 24.765625 -33.734375 Z M 48.484375 -36.359375 L 3.15625 -36.359375 L 3.15625 -56.90625 L 48.484375 -56.90625 Z M 24.765625 -59.546875 L 3.6875 -59.546875 L 3.6875 -92.21875 L 24.765625 -92.21875 Z M 51.109375 -92.21875 L 72.203125 -92.21875 L 72.203125 0 L 51.109375 0 Z"
